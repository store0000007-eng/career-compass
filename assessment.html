<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Compass — Assessment</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
      padding: 25px;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.08);
    }

    .top {
      margin-bottom: 30px;
    }

    .label {
      color: #4f46e5;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .progress {
      height: 8px;
      background: #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 20px;
    }

    .progress-bar {
      height: 100%;
      width: 20%;
      background: #4f46e5;
      transition: width 0.3s;
    }

    .question {
      font-size: 23px;
      font-weight: bold;
      line-height: 1.4;
      margin-bottom: 25px;
    }

    .options {
      display: grid;
      gap: 12px;
    }
