<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career Compass</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      max-width: 850px;
      width: 100%;
      background: white;
      border-radius: 24px;
      padding: 55px 35px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0,0,0,0.08);
    }

    .badge {
      display: inline-block;
      background: #eef2ff;
      color: #4f46e5;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 18px;
    }

    p {
      color: #6b7280;
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    button {
      border: none;
      background: #111827;
      color: white;
      padding: 15px 28px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    #message {
      margin-top: 25px;
      font-size: 16px;
      color: #4f46e5;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="badge">AI-Powered Career Assessment</div>

    <h1>Find Your Career Direction.</h1>

    <p>
      Discover careers that match your interests, strengths,
      personality and goals with a personalized AI assessment.
    </p>

    <button onclick="startAssessment()">
      Start Your Assessment →
    </button>

    <div id="message"></div>
  </div>

  <script>
    function startAssessment() {
      document.getElementById("message").textContent =
        "Your assessment is coming next. 🚀";
    }
  </script>

</body>
</html>
